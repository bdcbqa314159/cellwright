name: Layers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Separate from ci.yml on purpose: the layer check is seconds, platform-independent,
# and has no dependency build, so it reports long before the matrix does.
jobs:
  layers:
    name: Layer conformance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check layering (CLAUDE.md section 1)
        run: python3 tools/check_layers.py
