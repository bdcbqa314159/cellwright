name: Layers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Separate from ci.yml on purpose: this check is green today and auto-runs,
# while the build matrix stays manual until the macOS Python link break is
# fixed (OPEN.md #3). Auto-triggering a known-red matrix buys a red badge,
# not information.
jobs:
  layers:
    name: Layer conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check layering (CLAUDE.md section 1)
        run: python3 tools/check_layers.py
